<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Classical energy branches of the square-lattice J1-J2 model</title>
  <desc id="desc">Néel and columnar product-state energy densities cross at J2 equal to one half.</desc>
  <style>
    text { font-family: Inter, system-ui, sans-serif; fill: #1a1d23; }
    .axis { stroke: #5a6070; stroke-width: 2; }
    .grid { stroke: #e2e2df; stroke-width: 1; }
    .neel { stroke: #4f46e5; stroke-width: 4; fill: none; }
    .col { stroke: #047857; stroke-width: 4; fill: none; }
    .mark { fill: #b45309; }
  </style>
  <text x="52" y="34" font-size="20" font-weight="600">Classical product-state branches</text>
  <line class="axis" x1="80" y1="350" x2="700" y2="350"/>
  <line class="axis" x1="80" y1="55" x2="80" y2="350"/>
  <line class="grid" x1="80" y1="202" x2="700" y2="202"/>
  <line class="grid" x1="390" y1="55" x2="390" y2="350"/>
  <path class="neel" d="M80 300 L700 55"/>
  <path class="col" d="M80 202 L700 350"/>
  <circle class="mark" cx="576" cy="320" r="7"/>
  <text x="478" y="286" fill="#b45309">J₂ = 0.8, e = -0.4</text>
  <text x="505" y="92" fill="#4f46e5">Néel: -1/2 + J₂/2</text>
  <text x="470" y="344" fill="#047857">columnar: -J₂/2</text>
  <text x="374" y="376">0.5</text>
  <text x="686" y="376">1.0</text>
  <text x="65" y="207" text-anchor="end">-0.25</text>
  <text x="65" y="305" text-anchor="end">-0.5</text>
  <text x="360" y="410">J₂ / J₁</text>
  <text transform="translate(22 260) rotate(-90)">energy per site</text>
</svg>

